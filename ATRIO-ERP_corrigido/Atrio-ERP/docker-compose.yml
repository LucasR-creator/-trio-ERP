services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atrio
      POSTGRES_USER: atrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrio"]
      interval: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://atrio:${POSTGRES_PASSWORD}@db:5432/atrio
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
